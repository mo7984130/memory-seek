[package]
name = "user"
version = "0.9.0"
edition.workspace = true
license.workspace = true

[features]
default = []
controller = ["dep:axum", "dep:common-web"]

[dependencies]
common-core = { workspace = true, features = ["multi-level-cache", "tokio", "redis"] }
common-crypto.workspace = true
common-web = { workspace = true, optional = true }
common-db.workspace = true
type-core.workspace = true
type-user = { workspace = true, features = ["orm"] }
s3-client.workspace = true
constant.workspace = true
share.workspace = true
audit.workspace = true
# ORM
sea-orm.workspace = true
# redis
redis.workspace = true
deadpool-redis.workspace = true
# Web Controller
axum = { workspace = true, optional = true }
# 日志
tracing.workspace = true
# 多级缓存
multi-level-cache.workspace = true
# 字节
bytes.workspace = true
# 媒体效验
media_validator.workspace = true
# uuid
uuid.workspace = true
# 错误定义
thiserror.workspace = true
