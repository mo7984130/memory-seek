name: CI

on:
    pull_request:
        branches: [main, dev]
    push:
        branches: [main, dev]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    CARGO_TERM_COLOR: always
    CARGO_INCREMENTAL: 0
    RUST_BACKTRACE: 1

jobs:
    fmt:
        name: fmt
        runs-on: ubuntu-22.04
        steps:
          - uses: actions/checkout@v5
          - uses: dtolnay/rust-toolchain@master
            with:
              toolchain: "1.100.0"
              components: rustfmt
          - run : cargo fmt --all -- --check

    spell:
        name: spell
        runs-on: ubuntu-22.04
        steps:
          - uses: actions/checkout@v5
          - name: Cache codebook
            id: codebook-cache
            uses: actions/cache@v5
            with:
              path: |
                ~/.cargo/bin/codebook-lsp
                ~/.cache/codebook
                ~/.local/share/codebook
              key: codebook-lsp-0.4.0-${{ runner.os }}
          - uses: cargo-bins/cargo-binstall@main
            if: steps.codebook-cache.outputs.cache-hit != 'true'
          - name: Install codebook
            if: steps.codebook-cache.outputs.cache-hit != 'true'
            run: cargo binstall -y codebook-lsp@0.4.0 || cargo install --locked codebook-lsp@0.4.0
          - run: codebook-lsp lint --unique .

    clippy:
        name: clippy
        runs-on: ubuntu-22.04
        steps:
          - uses: actions/checkout@v5
          - uses: dtolnay/rust-toolchain@master
            with:
              toolchain: "1.100.0"
              components: clippy
          - uses: Swatinem/rust-cache@v2
            with:
              shared-key: ci
              save-if: ${{ github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' }}
          - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

    test:
        name: test
        runs-on: ubuntu-22.04
        steps:
          - uses: actions/checkout@v5
          - uses: dtolnay/rust-toolchain@master
            with:
              toolchain: "1.100.0"
          - uses: Swatinem/rust-cache@v2
            with:
              shared-key: ci
              save-if: ${{ github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' }}
          - run: cargo test --locked --workspace --all-features --no-fail-fast

    features:
        name: features
        runs-on: ubuntu-22.04
        steps:
            - uses: actions/checkout@v5
            - uses: dtolnay/rust-toolchain@master
              with:
                toolchain: "1.100.0"
            - uses: Swatinem/rust-cache@v2
              with:
                shared-key: ci
                save-if: ${{ github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' }}
            - uses: taiki-e/install-action@v2
              with:
                tool: cargo-hack@0.6.45
            - run: bash scripts/check-features.sh --depth 2
