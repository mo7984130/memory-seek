name: CI

on:
    pull_request:
        branches: [main, dev]
    push:
        branches: [main, dev]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    CARGO_TERM_COLOR: always
    CARGO_INCREMNTAL: 0
    RUST_BACKTRACE: 1

jobs:
    fmt:
        name: fmt
        runs-on: ubuntu-22.04
        steps:
          - uses: actions/checkout@v4
          - uses: dtolnay/rust-toolchain@master
            with:
              toolchain: "1.100.0"
              components: rustfmt
          - run : cargo fmt --all -- --check
